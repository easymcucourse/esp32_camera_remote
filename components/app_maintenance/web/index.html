<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相机遥控器维护</title>
<style>body{font:16px system-ui;background:#eef1f5;color:#172331;margin:0;padding:20px}main{max-width:640px;margin:auto}section{background:white;padding:20px;border-radius:12px;margin:16px 0}input,select,button{box-sizing:border-box;font:inherit;padding:10px;margin:5px 0;max-width:100%}input:not([type=checkbox]),select{width:100%}button{background:#1467b0;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{color:#a52a2a}label{display:block}small{color:#536477}</style>
<main><h1>相机遥控器 · 维护</h1><p>本页不认证。连接此设备热点的任何客户端均可修改设置、上传固件及重启。维护只能在启动界面访问热点网页进入，退出后设备会重启。</p><p id="message" role="status"></p>
<section><h2>设备信息</h2><pre id="info"></pre></section>
<section><h2>热点设置</h2><form id="wifiForm"><label>SSID <input id="ssid" required maxlength="32"></label><label>新密码 <input id="password" type="password" minlength="8" maxlength="63" autocomplete="new-password" placeholder="留空保持现有密码"></label><small id="passwordInfo"></small><label><input id="showNewPassword" type="checkbox"> 显示输入的新密码</label><button id="random" type="button">生成随机密码</button><label><input id="showPassword" type="checkbox"> 下次连接页显示热点密码</label><label>信道 <select id="channel"></select></label><button>保存热点设置</button></form><p>保存成功后设备会重启；请使用保存的 SSID 和密码重新连接。</p></section>
<section><h2>正常应用设置</h2><form id="settingsForm"><label>手柄类型 <select id="controllerType"><option value="ds">DS 手柄</option><option value="xbox">Xbox 兼容手柄</option></select></label><label>INFO 显示 <select id="infoLevel"><option value="0">完整</option><option value="1">简略</option><option value="2">隐藏</option></select></label><button>保存并重启</button></form><p>这些设置在下一次启动正常应用时生效。</p></section>
<section><h2>更新 LCD 固件</h2><form id="otaForm"><input id="firmware" type="file" accept=".bin" required><button>检查并上传</button></form><progress id="otaProgress" max="100" value="0"></progress><p id="otaMessage"></p></section>
<section><h2>恢复出厂</h2><button id="factoryWifi">重置热点并重启</button> <button id="factoryAll">全部重置并重启</button><p>重置热点会恢复默认 SSID、密码和信道。全部重置还会清除相机配对及应用设置，下次连接相机需要重新确认配对。</p></section>
<section><button id="reboot">重启设备</button> <button id="exit">退出维护并重启</button></section></main>
<script>
const el=id=>document.getElementById(id);let timer,reconnectMessage='';
function message(error){el('message').textContent=error.message}
function clearPassword(){el('password').value='';el('showNewPassword').checked=false;el('password').type='password'}
async function request(path,body){const headers={};if(body)headers['Content-Type']='application/json';let response;try{response=await fetch(path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,cache:'no-store'})}catch(error){throw Error(reconnectMessage||'设备连接中断，请重新连接热点后刷新页面。')}const data=await response.json().catch(()=>({error:'请求失败'}));if(!response.ok)throw Error((data.field?data.field+': ':'')+data.error);return data}
async function refresh(){try{el('info').textContent=JSON.stringify(await request('/api/info'),null,2)}catch(error){message(error)}}
async function loadWifi(){const data=await request('/api/wifi');el('ssid').value=data.ssid;el('showPassword').checked=data.show_password;el('channel').replaceChildren();for(let i=1;i<=data.max_channel;i++){const option=document.createElement('option');option.value=i;option.textContent=i;option.selected=i===data.channel;el('channel').append(option)}el('passwordInfo').textContent='当前密码长度 '+data.password_len;if(data.apply_state==='failed')throw Error('热点更新失败：'+data.apply_error)}
async function loadSettings(){const data=await request('/api/settings');el('controllerType').value=data.type;el('infoLevel').value=data.info_level}
el('showNewPassword').onchange=()=>el('password').type=el('showNewPassword').checked?'text':'password';
el('random').onclick=async()=>{try{el('password').value=(await request('/api/wifi/random_password')).password}catch(error){message(error)}};
el('wifiForm').onsubmit=async event=>{event.preventDefault();if(!confirm('网络参数变化会断开连接。请记住新 SSID 和密码，继续保存？'))return;const ssid=el('ssid').value,body={ssid,channel:Number(el('channel').value),show_password:el('showPassword').checked};if(el('password').value)body.password=el('password').value;try{const data=await request('/api/wifi',body);clearPassword();if(data.reboot_after_apply){clearInterval(timer);reconnectMessage='已提交，保存成功后设备会重启。请连接「'+ssid+'」后刷新本页。';el('message').textContent=reconnectMessage}else{await loadWifi();el('message').textContent='热点设置已提交，可查询应用结果。'}}catch(error){message(error)}};
el('settingsForm').onsubmit=async event=>{event.preventDefault();if(!confirm('保存后设备会重启，设置在下次正常启动生效。继续？'))return;try{await request('/api/settings',{type:el('controllerType').value,info_level:Number(el('infoLevel').value)});clearInterval(timer);clearPassword();el('message').textContent='设置已保存，设备即将重启。'}catch(error){message(error)}};
async function binary(path,file,total){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Image-Size':String(total)},body:file});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
el('otaForm').onsubmit=async event=>{event.preventDefault();const file=el('firmware').files[0];if(!file)return;try{if(file.size<320||file.size>5242880)throw Error('请选择不超过 5 MiB 的 LCD 固件 .bin。');const info=await binary('/api/ota/check',file.slice(0,288),file.size);const warning=info.same_or_older?'版本相同或编译时间更早，仍可更新。\n':'';if(!confirm(warning+'当前 '+info.current_version+' → '+info.version+'\n编译 '+info.date+' '+info.time+'\n确认上传并重启？'))return;clearInterval(timer);el('otaMessage').textContent='正在上传，请勿断电。';await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/ota');xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.timeout=120000;xhr.upload.onprogress=e=>{if(e.lengthComputable){const percent=Math.round(e.loaded*100/e.total);el('otaProgress').value=percent;el('otaMessage').textContent='上传 '+percent+'%；完成后设备将校验镜像。'}};xhr.onload=()=>{let data;try{data=JSON.parse(xhr.responseText)}catch(error){return reject(Error('无效上传响应'))}if(xhr.status!==200)return reject(Error(data.error||'上传失败'));resolve(data)};xhr.onerror=()=>reject(Error('上传或更新回执中断；设备可能已完成更新，请重新连接检查状态。'));xhr.ontimeout=()=>reject(Error('上传超时，请重新连接检查状态。'));xhr.send(file)});clearPassword();el('message').textContent='镜像校验通过，设备即将重启。维护需在下次启动界面访问网页进入。'}catch(error){message(error);try{const status=await request('/api/ota/status');el('otaMessage').textContent=status.state+(status.error?'：'+status.error:'')}catch(statusError){message(statusError)}timer=setInterval(refresh,5000)}};
async function reboot(path){if(!confirm('确认重启设备？热点连接将断开。'))return;try{await request(path,{confirm:true});clearInterval(timer);clearPassword();el('message').textContent='设备即将重启。'}catch(error){message(error)}}
async function factory(scope){const details=scope==='all'?'恢复默认热点，并清除相机配对及应用设置':'恢复默认热点设置';if(!confirm(details+'？设备将重启，热点连接会断开。'))return;try{await request('/api/factory',{scope,confirm:true});clearInterval(timer);clearPassword();el('message').textContent='重置完成，设备即将重启。请重新连接默认热点；全量重置后重新确认相机配对。'}catch(error){message(error)}}
el('factoryWifi').onclick=()=>factory('wifi');el('factoryAll').onclick=()=>factory('all');
el('reboot').onclick=()=>reboot('/api/reboot');el('exit').onclick=()=>reboot('/api/maint/exit');
(async()=>{try{await loadWifi();await loadSettings();await refresh();timer=setInterval(refresh,5000)}catch(error){message(error)}})();
</script></html>
