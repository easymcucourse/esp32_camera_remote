<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相机遥控器维护</title>
<style>body{font:16px system-ui;background:#eef1f5;color:#172331;margin:0;padding:20px}main{max-width:640px;margin:auto}section{background:white;padding:20px;border-radius:12px;margin:16px 0}input,select,button{box-sizing:border-box;font:inherit;padding:10px;margin:5px 0;max-width:100%}input:not([type=checkbox]),select{width:100%}button{background:#1467b0;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{color:#a52a2a}label{display:block}small{color:#536477}</style>
<main><h1>相机遥控器 · 维护</h1><p id="message" role="status"></p><section id="login"><form id="loginForm"><label>输入屏幕上的 PIN <input id="pin" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"></label><button>登录</button></form></section>
<div id="controls" hidden><section><h2>设备信息</h2><pre id="info"></pre></section><section><h2>热点设置</h2><form id="wifiForm"><label>SSID <input id="ssid" required maxlength="32"></label><label>新密码 <input id="password" type="password" minlength="8" maxlength="63" autocomplete="new-password" placeholder="留空保持现有密码"></label><small id="passwordInfo"></small><label><input id="showNewPassword" type="checkbox"> 显示新密码</label><button id="random" type="button">生成随机密码</button><label>信道 <select id="channel"></select></label><button>保存热点设置</button></form><p>保存后热点会重启，请使用新的 SSID 和密码重新连接。</p></section><section><h2>更新 LCD 固件</h2><form id="otaForm"><input id="firmware" type="file" accept=".bin" required><button>检查并上传</button></form><progress id="otaProgress" max="100" value="0"></progress><p id="otaMessage"></p></section><section><button id="reboot">重启设备</button> <button id="logout">退出登录</button> <button id="exit">关闭维护模式</button></section></div></main>
<script>
let token='',timer,reconnectMessage='';const el=id=>document.getElementById(id);function clear(){token='';clearInterval(timer);el('controls').hidden=true;el('login').hidden=false;el('pin').value='';el('password').value='';el('showNewPassword').checked=false;el('password').type='password'}
async function request(path,body){const headers={};if(token)headers.Authorization='Bearer '+token;if(body)headers['Content-Type']='application/json';let response;try{response=await fetch(path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,cache:'no-store'})}catch(error){clear();throw Error(reconnectMessage||'维护模式已关闭（可能因相机已连接），请在设备上重新开启。')}const data=await response.json().catch(()=>({error:'请求失败'}));if(response.status===401)clear();if(!response.ok)throw Error((data.field?data.field+': ':'')+data.error+(data.retry_after?'，请等待 '+data.retry_after+' 秒':''));return data}
function message(error){el('message').textContent=error.message}async function refresh(){try{const data=await request('/api/info');el('info').textContent=JSON.stringify(data,null,2)}catch(error){message(error)}}
async function loadWifi(){const data=await request('/api/wifi');el('ssid').value=data.ssid;el('channel').replaceChildren();for(let i=1;i<=data.max_channel;i++){const option=document.createElement('option');option.value=i;option.textContent=i;option.selected=i===data.channel;el('channel').append(option)}el('passwordInfo').textContent='当前密码长度 '+data.password_len+'；连接页显示密码：'+(data.show_password?'开启':'隐藏');if(data.apply_state==='failed')throw Error('热点更新失败：'+data.apply_error)}
el('loginForm').onsubmit=async event=>{event.preventDefault();try{const data=await request('/api/login',{pin:el('pin').value});token=data.token;el('pin').value='';el('message').textContent='';reconnectMessage='';el('login').hidden=true;el('controls').hidden=false;await loadWifi();await refresh();clearInterval(timer);timer=setInterval(refresh,5000)}catch(error){message(error)}};
el('showNewPassword').onchange=()=>el('password').type=el('showNewPassword').checked?'text':'password';
el('random').onclick=async()=>{try{const data=await request('/api/wifi/random_password');el('password').value=data.password}catch(error){message(error)}};
el('wifiForm').onsubmit=async event=>{event.preventDefault();if(!confirm('热点将重启，当前网页连接会断开，请用新的 SSID 和密码重新连接。继续保存？'))return;const ssid=el('ssid').value,body={ssid,channel:Number(el('channel').value)};if(el('password').value)body.password=el('password').value;try{const data=await request('/api/wifi',body);if(data.restart_in_ms){reconnectMessage='更改已提交，热点将在约 1.5 秒后重启。请连接「'+ssid+'」后刷新本页并重新输入 PIN。';clear();el('message').textContent=reconnectMessage}else{await loadWifi();el('password').value='';el('message').textContent='热点配置已是所选值。'}}catch(error){message(error)}};
async function binary(path,file,total){const response=await fetch(path,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/octet-stream','X-Image-Size':String(total)},body:file});const data=await response.json();if(response.status===401)clear();if(!response.ok)throw Error(data.error);return data}
el('otaForm').onsubmit=async event=>{event.preventDefault();const file=el('firmware').files[0];if(!file)return;try{if(file.size<320||file.size>6291456)throw Error('请选择不超过 6 MiB 的 LCD 固件 .bin。');const info=await binary('/api/ota/check',file.slice(0,288),file.size);const warning=info.same_or_older?'版本相同或编译时间更早，仍可更新。\n':'';if(!confirm(warning+'当前 '+info.current_version+' → '+info.version+'\n编译 '+info.date+' '+info.time+'\n确认上传并重启？'))return;clearInterval(timer);el('otaMessage').textContent='正在上传，请勿断电。';await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/ota');xhr.setRequestHeader('Authorization','Bearer '+token);xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.timeout=120000;xhr.upload.onprogress=e=>{if(e.lengthComputable){const percent=Math.round(e.loaded*100/e.total);el('otaProgress').value=percent;el('otaMessage').textContent='上传 '+percent+'%；完成后设备将校验镜像。'}};xhr.onload=()=>{let data;try{data=JSON.parse(xhr.responseText)}catch(error){return reject(Error('无效上传响应'))}if(xhr.status!==200)return reject(Error(data.error||'上传失败'));resolve(data)};xhr.onerror=()=>reject(Error('上传或更新回执中断；设备可能已完成更新，请重新连接后检查更新状态。'));xhr.ontimeout=()=>reject(Error('上传超时，请重新连接检查状态。'));xhr.send(file)});clear();el('message').textContent='固件校验通过，设备即将重启。请重新连接热点；维护模式需重新开启。'}catch(error){message(error);if(token){try{const status=await request('/api/ota/status');el('otaMessage').textContent=status.state+(status.error?'：'+status.error:'')}catch(statusError){message(statusError)}timer=setInterval(refresh,5000)}}};
el('reboot').onclick=async()=>{if(!confirm('确认重启设备？热点连接将断开。'))return;try{await request('/api/reboot',{confirm:true});clear();el('message').textContent='设备将在约 1.5 秒后重启，请重新连接热点。维护模式需重新开启。'}catch(error){message(error)}};
el('logout').onclick=async()=>{try{await request('/api/logout',{});clear()}catch(error){message(error)}};
el('exit').onclick=async()=>{try{await request('/api/maint/exit',{});clear();el('message').textContent='维护模式已关闭。'}catch(error){message(error)}};
</script></html>
